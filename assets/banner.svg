<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f2937" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#111827" stop-opacity="0.9" />
    </linearGradient>

    <!-- Accent Gradients -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>

    <linearGradient id="cyanPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <linearGradient id="amberRose" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="35" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="glowPurple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="40" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />
    </pattern>

    <style>
      @keyframes floatOrb1 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(60px, 30px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0%, 100% { transform: translate(0px, 0px) scale(1); }
        50% { transform: translate(-50px, -25px) scale(1.2); }
      }
      @keyframes floatCard1 {
        0%, 100% { transform: translateY(0px) rotate(-6deg); }
        50% { transform: translateY(-16px) rotate(-4deg); }
      }
      @keyframes floatCard2 {
        0%, 100% { transform: translateY(0px) rotate(8deg); }
        50% { transform: translateY(-20px) rotate(11deg); }
      }
      @keyframes pulseNode {
        0%, 100% { opacity: 0.3; transform: scale(0.95); }
        50% { opacity: 0.8; transform: scale(1.1); }
      }
      @keyframes shimmerLine {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      .orb-1 { animation: floatOrb1 10s ease-in-out infinite; }
      .orb-2 { animation: floatOrb2 12s ease-in-out infinite; }
      .card-float-left { animation: floatCard1 6s ease-in-out infinite; transform-origin: 120px 220px; }
      .card-float-right { animation: floatCard2 7s ease-in-out infinite; transform-origin: 1080px 210px; }
      .pulse-ring { animation: pulseNode 4s ease-in-out infinite; transform-origin: center; }
      .shimmer-path { stroke-dasharray: 20 10; animation: shimmerLine 20s linear infinite; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="420" rx="16" fill="url(#bgGrad)" />
  <rect width="1200" height="420" rx="16" fill="url(#grid)" />

  <!-- Dynamic Ambient Glowing Orbs (in Background) -->
  <g opacity="0.35">
    <circle class="orb-1" cx="220" cy="110" r="140" fill="#3b82f6" filter="url(#glowCyan)" />
    <circle class="orb-2" cx="980" cy="300" r="160" fill="#a855f7" filter="url(#glowPurple)" />
    <circle class="orb-1" cx="600" cy="380" r="130" fill="#ec4899" filter="url(#glowCyan)" opacity="0.25" />
  </g>

  <!-- Network Circuit Lines (Simulating Game Tree / MCTS) -->
  <g opacity="0.25" stroke="#38bdf8" stroke-width="1.5" fill="none">
    <path class="shimmer-path" d="M 120 80 Q 300 150 480 90 T 800 120 T 1100 70" />
    <path class="shimmer-path" d="M 80 340 Q 350 260 600 350 T 1050 320" />
    <circle cx="480" cy="90" r="4" fill="#38bdf8" />
    <circle cx="800" cy="120" r="4" fill="#a855f7" />
    <circle cx="350" cy="260" r="4" fill="#ec4899" />
  </g>

  <!-- Decorative Floating Playing Card (Left Side) -->
  <g class="card-float-left">
    <rect x="50" y="120" width="130" height="190" rx="12" fill="url(#cardGrad)" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.4" />
    <rect x="58" y="128" width="114" height="174" rx="8" fill="#0f172a" fill-opacity="0.7" />
    <text x="70" y="160" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="22">A♠</text>
    <text x="115" y="225" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" text-anchor="middle">♠</text>
    <text x="155" y="285" fill="#38bdf8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="20" text-anchor="end">A</text>
  </g>

  <!-- Decorative Floating Playing Card (Right Side) -->
  <g class="card-float-right">
    <rect x="1010" y="110" width="130" height="190" rx="12" fill="url(#cardGrad)" stroke="#ec4899" stroke-width="2" stroke-opacity="0.4" />
    <rect x="1018" y="118" width="114" height="174" rx="8" fill="#0f172a" fill-opacity="0.7" />
    <text x="1030" y="150" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="22">K♥</text>
    <text x="1075" y="215" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="38" text-anchor="middle">♥</text>
    <text x="1115" y="275" fill="#f43f5e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="bold" font-size="20" text-anchor="end">K</text>
  </g>

  <!-- FOREGROUND: Titles and Badges (Explicitly on Top) -->
  <g id="foreground-content">
    <!-- Top Pill Badge -->
    <g transform="translate(425, 48)">
      <rect x="0" y="0" width="350" height="34" rx="17" fill="#1e293b" fill-opacity="0.9" stroke="#6366f1" stroke-width="1.5" />
      <circle cx="18" cy="17" r="5" fill="#10b981" />
      <text x="32" y="22" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" letter-spacing="0.5">
        🃏 CURATED GAME AI &amp; CARD SIMULATIONS
      </text>
    </g>

    <!-- Main Title (Gradient Fill + High Contrast Foreground) -->
    <text x="600" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', sans-serif" font-weight="900" font-size="44" fill="url(#primaryGrad)" letter-spacing="-0.5">
      Game AI &amp; Card Game Simulations
    </text>

    <!-- Subtitle -->
    <text x="600" y="190" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="500" font-size="18" fill="#94a3b8" letter-spacing="0.2">
      Imperfect-Information AI • Poker &amp; Bridge Solvers • Digital Tabletops • TCG Rules Engines
    </text>

    <!-- Feature Pills in Center -->
    <g transform="translate(240, 225)">
      <!-- Pill 1 -->
      <g transform="translate(0, 0)">
        <rect width="165" height="36" rx="18" fill="#1e293b" stroke="#3b82f6" stroke-width="1.2" />
        <text x="82" y="23" text-anchor="middle" fill="#60a5fa" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">⚡ MCTS &amp; CFR Solvers</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(180, 0)">
        <rect width="170" height="36" rx="18" fill="#1e293b" stroke="#8b5cf6" stroke-width="1.2" />
        <text x="85" y="23" text-anchor="middle" fill="#c084fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🧠 Multi-Agent RL</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(365, 0)">
        <rect width="170" height="36" rx="18" fill="#1e293b" stroke="#ec4899" stroke-width="1.2" />
        <text x="85" y="23" text-anchor="middle" fill="#f472b6" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🎴 TCG Rules Engines</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(550, 0)">
        <rect width="170" height="36" rx="18" fill="#1e293b" stroke="#10b981" stroke-width="1.2" />
        <text x="85" y="23" text-anchor="middle" fill="#34d399" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600">🌐 Web Tabletops</text>
      </g>
    </g>

    <!-- Bottom Secondary Info / Metadata Pill -->
    <g transform="translate(390, 295)">
      <rect width="420" height="32" rx="16" fill="#0f172a" fill-opacity="0.8" stroke="#334155" stroke-width="1" />
      <text x="210" y="21" text-anchor="middle" fill="#64748b" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="500">
        🏆 Curated Open-Source Frameworks &amp; Enterprise SaaS Platforms
      </text>
    </g>
  </g>
</svg>